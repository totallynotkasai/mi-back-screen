# Checks that every push builds on a clean machine: unit tests, lint and a release build.
# No signing keys here, so the release APK is unsigned; releases are built and signed locally.
name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The same JDK as local builds (Android Studio's JBR 21).
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Unit tests, lint and an unsigned release build
        run: ./gradlew testDebugUnitTest lintDebug assembleRelease

      - name: Upload the reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: app/build/reports
